aid: varsity-tutors
name: Varsity Tutors
description: >-
  Varsity Tutors, a Nerdy company (NYSE: NRDY), is a St. Louis based live online
  learning platform that connects K-12, college, graduate and professional learners
  with expert instructors for private one-on-one tutoring, small-group and large-format
  live classes, test preparation, practice tests and diagnostics across more than 3,000
  subjects. Alongside its direct-to-consumer memberships it sells Varsity Tutors for
  Schools to school districts, and it ships an AI-enhanced learning surface at
  ai.varsitytutors.com. The company operates a production API gateway at
  api.varsitytutors.com that serves its own web and mobile clients, but it publishes no
  public developer portal, API reference or machine-readable contract; its only
  documented third-party integration surface is its Clever app-gallery listing, which
  provides Clever Instant Login SSO and Clever Secure Sync rostering to districts.
